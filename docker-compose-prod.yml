name: policycoherencekit

services:
  web:
    container_name: policycoherencekit-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    env_file:
      - ./apps/web/.env
    depends_on:
      - api
    networks:
      - app-network
      # The shared HTTPS proxy (nginx/ in the DEMATELab repo) reaches this container as policycoherencekit-web.
      - proxy
    restart: unless-stopped

  api:
    container_name: policycoherencekit-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    # API settings come from the API's own env file; Compose overrides only what Docker decides.
    # Stateless: no volume.
    env_file:
      - ./apps/api/.env
    environment:
      - APP_ENV=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:50002/api/v1/is-alive')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
      # The shared HTTPS proxy (nginx/ in the DEMATELab repo) reaches this container as policycoherencekit-api.
      - proxy
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
  # Shared with the HTTPS proxy in DEMATELab's nginx/. External, so `just prod-down` never removes it;
  # `just prod` creates it when missing.
  proxy:
    external: true
    name: proxy
