# Dependency manifest for uv and the Docker images. The app is a flat set of modules run
# with `python main.py`, so it is not built or installed as a package.
[project]
name = "policycoherencekit"
version = "0.1.0"
description = "Desktop application for assessing, aggregating, and analysing policy coherence."
requires-python = ">=3.9"
dependencies = [
    "openpyxl",
    "numpy",
    "reportlab",
    "Pillow",
]

[dependency-groups]
# Dev-only tooling; the dev container uses watchfiles to restart the GUI on code changes.
dev = [
    "watchfiles>=1.0.0",
]

[tool.uv]
package = false
