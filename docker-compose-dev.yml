name: policycoherencekit-dev

services:
  policycoherencekit:
    container_name: policycoherencekit-dev
    image: policycoherencekit:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./.env
        required: false
    environment:
      - APP_MODE=dev
    ports:
      # Bound to localhost only: the dev session has no password by default.
      - "127.0.0.1:${NOVNC_PORT:-6090}:6080"
    volumes:
      # Live source: edits to the root-level .py files restart the GUI.
      - .:/app
      - ./Example data:/workspace/examples:ro
      - ./exports:/workspace/exports
    shm_size: 256mb
    restart: unless-stopped
    healthcheck:
      # Runs as root: use the system Python in isolated mode (ignores the app-writable cwd).
      test: ["CMD", "/usr/local/bin/python3", "-I", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6080/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
